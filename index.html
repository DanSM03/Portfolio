<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="src/imgs/BearDSMDev_Logo.ico" type="image/x-icon" />
    <title>Danser03 Portfolio</title>
    <link rel="stylesheet" href="src/css/styles.css" />
  </head>
  <body>
    <div class="top-bar">
      <!-- HEADER -->
      <header>
        <figure class="logo-container">
          <img
            src="src/imgs/BearDSMDev_Logo.svg"
            alt="BearDSMDev_Logo"
            class="logo"
          />
        </figure>
        <h1>Welcome to <span class="dev_user">Danser03</span> Portfolio</h1>
      </header>
      <!-- //HEADER -->
      <!-- NAVBAR -->
      <nav class="navbar">
        <ul class="nav-list">
          <li><a href="#home">Home</a></li>
          <li><a href="#projects">Projects</a></li>
          <li><a href="#about">About</a></li>
          <li><a href="#contact">Contact</a></li>
        </ul>
      </nav>
      <!-- // NAVBAR -->
    </div>
    <div class="content">
      <!-- PHOTO AND EDUCATIONAL LEVEL -->
      <aside class="profile_aside">
        <figure class="profile-container">
          <img
            class="profile-image"
            src="src/imgs/ProfilePic.png"
            alt="Profile picture"
          />
        </figure>
        <div class="profile-name">
          <h2>Daniel Serna Muriel</h2>
          <p>Técnico en sistemas</p>
        </div>
      </aside>
      <!-- // PHOTO AND EDUCATIONAL LEVEL -->
      <main class="main-content">
        <figure class="under-construction-container">
          <img
            class="under-construction"
            src="/src/imgs/UnderConstruction.jpg"
            alt="Web Under Construction"
          />
          <figcaption>
            This website is currently under construction. Please check back
            later!
          </figcaption>
        </figure>
      </main>
    </div>
    <footer class="footer">
      <p>&copy; 2025 Danser03. All rights reserved.</p>
      <div class="social-media"></div>
    </footer>
  </body>
</html>
